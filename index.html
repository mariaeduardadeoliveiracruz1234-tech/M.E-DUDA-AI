<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d45b8">
  <title>M.E Duda AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f0fa;
      color: #29243a;
    }

    header {
      background: #6d45b8;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 6px; }
    header p { margin: 0; }

    main {
      max-width: 700px;
      margin: 20px auto;
      padding: 0 12px 20px;
    }

    #chat {
      background: white;
      border-radius: 14px;
      padding: 16px;
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      box-shadow: 0 3px 12px #00000012;
    }

    .msg {
      padding: 11px 13px;
      border-radius: 12px;
      margin: 10px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .duda { background: #eee7fb; }
    .user { background: #dff4e7; }

    .msg img {
      display: block;
      max-width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 8px;
    }

    #status {
      color: #665b79;
      font-size: 14px;
      margin: 10px 2px;
      min-height: 18px;
    }

    .composer {
      background: white;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
      box-shadow: 0 3px 12px #00000012;
    }

    #message {
      width: 100%;
      min-width: 0;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button, .file-button {
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      background: #6d45b8;
      color: white;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }

    .file-button { background: #eee7fb; color: #51318d; }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #imageInput { display: none; }

    #previewArea {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #f3f0fa;
      border-radius: 10px;
    }

    #preview {
      display: block;
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    #removeImage {
      background: #e8e3ef;
      color: #443852;
    }

    .hint {
      font-size: 12px;
      color: #665b79;
      margin: 10px 2px 0;
    }

    @media (max-width: 420px) {
      .toolbar button, .toolbar label {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>✨ M.E Duda AI</h1>
    <p>Sua assistente pessoal inteligente 💜</p>
  </header>

  <main>
    <div id="chat" aria-live="polite">
      <div class="msg duda">
        <strong>Duda:</strong>
        Olá! 💜 Sou a Duda. Posso ajudar você a estudar Direito,
        escrever textos, organizar tarefas, analisar fotos e muito mais!
        Como posso ajudar?
      </div>
    </div>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="composer">
      <form id="form">
        <textarea
          id="message"
          rows="2"
          placeholder="Converse com a Duda..."
          aria-label="Sua mensagem"
        ></textarea>

        <div id="previewArea">
          <img id="preview" alt="Prévia da foto selecionada">
          <button id="removeImage" type="button">✖ Remover foto</button>
        </div>

        <div class="toolbar">
          <label for="imageInput" class="file-button">
            📸 Enviar foto
          </label>

          <input
            id="imageInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
          >

          <button id="send" type="submit">💬 Enviar</button>

          <button id="generate" type="button">
            🎨 Criar imagem
          </button>
        </div>
      </form>

      <p class="hint">
        💡 Você pode escrever uma mensagem, anexar uma foto ou pedir
        uma imagem para a Duda criar.
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const statusText = document.getElementById("status");
    const send = document.getElementById("send");
    const generate = document.getElementById("generate");
    const imageInput = document.getElementById("imageInput");
    const previewArea = document.getElementById("previewArea");
    const preview = document.getElementById("preview");
    const removeImage = document.getElementById("removeImage");

    let selectedImage = null;

    function addMessage(who, text, className, imageUrl = null) {
      const div = document.createElement("div");
      div.className = "msg " + className;

      const label = document.createElement("strong");
      label.textContent = who + ": ";
      div.appendChild(label);

      if (text) {
        div.appendChild(document.createTextNode(text));
      }

      if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = className === "user"
          ? "Foto enviada pelo usuário"
          : "Imagem criada pela Duda";
        img.loading = "lazy";
        div.appendChild(img);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function clearImage() {
      selectedImage = null;
      imageInput.value = "";
      preview.removeAttribute("src");
      previewArea.style.display = "none";
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];

      if (!file) return;

      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if (!allowedTypes.includes(file.type)) {
        statusText.textContent =
          "Escolha uma imagem JPG, PNG ou WebP.";
        clearImage();
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        statusText.textContent =
          "A foto deve ter no máximo 5 MB.";
        clearImage();
        return;
      }

      selectedImage = file;
      preview.src = URL.createObjectURL(file);
      previewArea.style.display = "block";
      statusText.textContent = "Foto selecionada! Escreva o que deseja saber sobre ela.";
    });

    removeImage.addEventListener("click", clearImage);

    async function readImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const result = String(reader.result);
          resolve(result.split(",")[1]);
        };

        reader.onerror = () => reject(
          new Error("Não consegui ler a foto selecionada.")
        );

        reader.readAsDataURL(file);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      const file = selectedImage;

      if (!message && !file) {
        statusText.textContent =
          "Digite uma mensagem ou selecione uma foto.";
        return;
      }

      if (send.disabled || generate.disabled) return;

      let imageUrl = null;

      try {
        if (file) {
          imageUrl = URL.createObjectURL(file);
        }

        addMessage(
          "Você",
          message || "O que você pode me dizer sobre esta foto?",
          "user",
          imageUrl
        );

        input.value = "";
        send.disabled = true;
        generate.disabled = true;
        statusText.textContent = "Duda está pensando...";

        const payload = { message };

        if (file) {
          payload.image = {
            data: await readImage(file),
            mimeType: file.type
          };
        }

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Não consegui responder.");
        }

        addMessage(
          "Duda",
          data.reply || "Não recebi uma resposta.",
          "duda"
        );

        statusText.textContent = "";
        clearImage();

      } catch (error) {
        statusText.textContent =
          error.message || "Não consegui responder. Tente novamente.";
      } finally {
        send.disabled = false;
        generate.disabled = false;
        input.focus();
      }
    });

    generate.addEventListener("click", async () => {
      const prompt = input.value.trim();

      if (!prompt) {
        statusText.textContent =
          "Descreva a imagem que você quer criar.";
        input.focus();
        return;
      }

      if (send.disabled || generate.disabled) return;

      addMessage("Você", "🎨 Criar imagem: " + prompt, "user");

      input.value = "";
      send.disabled = true;
      generate.disabled = true;
      statusText.textContent = "Preparando sua imagem...";

      try {
        const response = await fetch("/generate-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Não consegui criar a imagem."
          );
        }

        if (!data.image) {
          throw new Error(
            "O servidor não retornou uma imagem."
          );
        }

        const imageUrl = data.image.startsWith("data:")
          ? data.image
          : "data:" + (data.mimeType || "image/png") +
            ";base64," + data.image;

        addMessage(
          "Duda",
          "Prontinho! 💜 Aqui está a imagem que você pediu:",
          "duda",
          imageUrl
        );

        statusText.textContent = "";

      } catch (error) {
        statusText.textContent =
          error.message || "Erro ao criar imagem.";
      } finally {
        send.disabled = false;
        generate.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
